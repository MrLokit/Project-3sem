<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07080a">
  <meta name="description" content="Голосовой ИИ-ассистент, определяющий эмоции по голосу">
  <title>Голосовой помощник</title>
  <link rel="stylesheet" href="style.css?v=20261108-2">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <span class="eyebrow">
        <span class="eyebrow__dot" aria-hidden="true"></span>
        Ассистент
      </span>
      <h1 class="app__title">Голосовой помощник</h1>
      <p class="app__subtitle">Нажмите на микрофон, чтобы определить эмоцию по голосу</p>
    </header>

    <section class="voice-control" id="voiceControl" aria-label="Голосовой ввод">
      <div class="mic-orbit">
        <span class="mic-orbit__ring mic-orbit__ring--outer" aria-hidden="true"></span>
        <span class="mic-orbit__ring mic-orbit__ring--inner" aria-hidden="true"></span>
        <button
          class="mic-button"
          id="micButton"
          type="button"
          aria-label="Начать запись"
          aria-pressed="false"
        >
          <svg
            class="mic-button__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="9" y="2" width="6" height="12" rx="3"></rect>
            <path d="M5 10a7 7 0 0 0 14 0"></path>
            <path d="M12 17v5"></path>
            <path d="M8 22h8"></path>
          </svg>
        </button>
      </div>
      <p class="voice-status" id="voiceStatus" role="status" aria-live="polite">
        Нажмите, чтобы говорить
      </p>
    </section>

    <section
      class="chat"
      id="chat"
      role="log"
      aria-live="polite"
      aria-label="Диалог с голосовым помощником"
    >
      <div class="chat__empty" id="chatEmpty">
        <span class="chat__empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            <path d="M8 12h.01M12 12h.01M16 12h.01"></path>
          </svg>
        </span>
        <p>Здесь появится ваш диалог</p>
      </div>
    </section>

    <p class="app__hint">
      Для записи и распознавания речи нужен микрофон и браузер с поддержкой MediaRecorder — например, Chrome или Edge.
    </p>
  </main>

  <script src="script.js?v=20261108-2"></script>
</body>
</html>
